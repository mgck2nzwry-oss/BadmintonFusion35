[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-court35"
version = "0.1.0"
description = "Reproducible 35-point, four-camera visual-IMU workflow for badminton training research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary development snapshot; see LICENSE"}
authors = [{name = "BadmintonCourt35 research team"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.8"]
pose2sim = ["pose2sim"]
paper = ["openpyxl>=3.1"]

[project.scripts]
court35 = "badminton_court35.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
